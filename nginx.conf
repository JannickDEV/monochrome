# General URL pass-through proxy used by the web app (js/proxy-utils.js).
# Needs the njs module -- the Dockerfile installs it and loads it.
js_import proxy from /etc/nginx/njs/monochrome-proxy.js;

server {
    listen 4173;
    listen [::]:4173;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:css|js|mjs|map|json|wasm|mp3|flac|wav|ogg|png|jpg|jpeg|svg|webp|ico|gz|br|utf|ttf|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # GET /proxy/?url=<percent-encoded absolute http(s) URL>
    # Relays third-party (non-infrastructure) GET/HEAD requests so the browser
    # doesn't hit them directly. Point PROXY_BASE_URL in js/proxy-utils.js at
    # this location (e.g. "/proxy/?url=") to route through the app's own origin.
    #
    # njs answers the CORS preflight and internal-redirects real requests to the
    # @proxy_upstream location. No `if` blocks here on purpose ("if is evil").
    location = /proxy/ {
        js_content proxy.handle;
    }

    location @proxy_upstream {
        js_set $proxy_target proxy.target;

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 10s;

        proxy_pass $proxy_target;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_set_header Cookie "";

        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, Accept-Ranges" always;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /sc-api/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass https://api-v2.soundcloud.com/;
        proxy_set_header Host api-v2.soundcloud.com;
        proxy_set_header Origin https://soundcloud.com;
        proxy_set_header Referer https://soundcloud.com/;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_ssl_server_name on;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers * always;
    }

    location /sc-web/ {
        proxy_pass https://soundcloud.com/;
        proxy_set_header Host soundcloud.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_ssl_server_name on;
        add_header Access-Control-Allow-Origin * always;
    }

    location /sc-sndcdn/ {
        proxy_pass https://a-v2.sndcdn.com/;
        proxy_set_header Host a-v2.sndcdn.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_ssl_server_name on;
        add_header Access-Control-Allow-Origin * always;
    }
}
